[phases.setup]
nixPkgs = ["poppler_utils", "tesseract", "nodejs_20"]

[phases.install]
cmds = ["pip install -r requirements.txt", "cd frontend && npm install"]

[phases.build]
cmds = ["cd frontend && npm run build && ls -la ../static/dist/assets/"]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT app:app"
